<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tinder Unsplash • Espace & Nature</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="tinder-container">
    <div class="card" id="card">
      <div class="card-image" id="card-image"></div>
      <div class="card-info">
        <h2 id="card-title"></h2>
        <p id="card-author"></p>
      </div>
    </div>
    <div class="actions">
      <button id="dislike-btn" class="btn dislike">✕</button>
      <button id="like-btn" class="btn like">♥</button>
    </div>
    <div class="export-section">
      <button id="export-btn">📥 Exporter les photos aimées (JSON)</button>
      <p id="status"></p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
